# Function bank for Try It: Station Average.
- call: get_readings(conn, station_id, start_date, end_date)
  summary: |-
    Already written for you at the top of the file. Gives back the list of row dictionaries for one station between two dates. Call it inside station_average.
- call: average_high(rows)
  summary: |-
    The function you write first. Call it inside station_average with the rows from get_readings, and return what it gives back.
- call: round(number, 1)
  summary: |-
    Rounds a number to a number of decimal places. The second value is how many places to keep.
  example: |-
    round(10 / 3, 1)
    # 3.3
