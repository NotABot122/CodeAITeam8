# What the Course offers, and how it decides what comes next.
# Topics are core projects. Revision projects review one concept each.
concepts:
  database_retrieval: Database Retrieval
  conditionals: Conditionals
  loops: Loops
  functions: Functions
  lists: Lists
  dictionaries: Dictionaries

topics:
  - id: data-logic
    title: Data, Decisions, and Loops
    project: weather-station
    themeable: true            # students can ask for this one in their own theme
    concepts: [database_retrieval, conditionals, loops, functions]
  - id: collections
    title: Lists and Dictionaries
    project: weather-collections
    themeable: false
    concepts: [lists, dictionaries, functions]

revision:
  database_retrieval: revision-database-retrieval
  conditionals: revision-conditionals
  loops: revision-loops
  functions: revision-functions
  lists: revision-lists
  dictionaries: revision-dictionaries

# The readiness diagnostic (diagnostic/) can set starting stages. Only results the
# diagnostic is confident about are used; the rest start at the profile's stage.
diagnostic:
  min_confidence: 0.8          # the diagnostic's own probability that its stage is right
  use_borderline: false        # concepts the diagnostic marks "borderline" are not used
  min_correct_answers: 2       # a stage above 0 needs this many correct answers on the concept (no lucky guesses)

# In-lesson intervention: after this many failed attempts on one level, insert that concept's practice
# once, then return to the level. If the diagnostic had given the concept a stage above 0, the stage is
# lowered to 0 and a diagnostic_mismatch event is logged. null turns it off.
intervention:
  struggle_after: 3

# How a finished project is judged, per concept, from its problems' attempts and hints.
# Change these after feedback; no code changes needed.
thresholds:
  strong:                      # every problem for the concept met both limits
    max_attempts: 2
    max_hints: 1
  struggled:                   # any problem for the concept hit one of these
    min_attempts: 4
    min_hints: 2
    practice_counts: true      # being sent to a practice problem counts as struggling

# Lesson pathways the Strands Decider 2B (engine/decider.py) picks from after the readiness check.
# The rules decide which pathways a student can get (`requires`: the stage the readiness check must be
# confident about, per concept; `needs_gap`: at least one concept the check is confident is a gap).
# The model only picks among those, and the rules' own pick is used whenever the model is off or its
# answer can't be used. Steps run in order. `project: revision` means the review project for the student's
# weakest concept. `start` is the first problem; `readiness` means the readiness check's placement.
pathways:
  - id: review-first
    stance: STANCE_REINFORCE
    title: Build the basics first
    summary: Start with a short review of the idea that needs the most work. Then build the Weather Station project one level at a time.
    needs_gap: true
    steps:
      - {project: revision}
      - {project: weather-station, start: level-1}
      - {project: weather-collections}
  - id: step-by-step
    stance: STANCE_ADVANCE
    title: Step by step
    summary: Build the Weather Station project from where the readiness check placed you, with extra practice before the parts that need it. Then move on to lists and dictionaries.
    steps:
      - {project: weather-station, start: readiness}
      - {project: weather-collections}
  - id: connect-ideas
    stance: STANCE_BRIDGE
    title: Connect the ideas
    summary: You already read data and make decisions well, so you start at Level 3, where loops and if statements work together on every record. Then move on to lists and dictionaries.
    requires: {database_retrieval: 2, conditionals: 2, loops: 1}
    steps:
      - {project: weather-station, start: level-3}
      - {project: weather-collections}
  - id: full-project
    stance: STANCE_PROJECT_SYNTHESIS
    title: Jump to the full project
    summary: You start at Level 4 and build the whole weather report, writing the helper functions it needs yourself. Then move on to lists and dictionaries.
    requires: {database_retrieval: 2, conditionals: 2, loops: 2, functions: 1}
    steps:
      - {project: weather-station, start: level-4}
      - {project: weather-collections}
