- "Start with a query that selects the five columns FROM daily_readings, then add a WHERE clause for the station and the dates."
- "Use ? in the SQL for each value and pass the values as a tuple: conn.execute(sql, (station_id, start_date, end_date)). Dates in YYYY-MM-DD format sort correctly as text, so >= and <= work on them."
- "ORDER BY date sorts the rows. To turn each row into a dictionary, cursor.description gives the column names, and zip(names, values) pairs them up."
