# Function bank for Level 3. sum(), max(), min(), len() and sorted() aren't allowed here, so they aren't listed.
- call: my_list.append(item)
  summary: |-
    Adds one item to the end of a list. It changes the list itself and gives back nothing.
  example: |-
    seen = []
    seen.append("2026-01-05")
- call: my_list.sort()
  summary: |-
    Puts a list in order, smallest first. Dates written as YYYY-MM-DD sort oldest first.
    It changes the list itself and gives back nothing. (This is allowed; sorted() isn't.)
  example: |-
    days = ["2026-01-09", "2026-01-02"]
    days.sort()
    # days is now ["2026-01-02", "2026-01-09"]
- call: round(number, 1)
  summary: |-
    Rounds a number to a number of decimal places. The second value is how many places to keep.
  example: |-
    round(12.345, 1)
    # 12.3
