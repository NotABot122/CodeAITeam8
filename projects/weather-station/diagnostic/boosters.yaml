# Easy "breather" questions for grades 9-12. They are never scored toward a stage; they only
# restore confidence after several misses in a row.
boosters:
  - id: boost-1
    type: choice
    prompt: "Which file extension does a Python file use?"
    options:
      - {id: a, text: ".py", correct: true}
      - {id: b, text: ".jpg"}
      - {id: c, text: ".mp3"}
    feedback_right: "Yes. Python files end in .py."
  - id: boost-2
    type: choice
    prompt: "A weather station measures rain in which unit?"
    options:
      - {id: a, text: "Millimeters", correct: true}
      - {id: b, text: "Kilograms"}
      - {id: c, text: "Seconds"}
    feedback_right: "Yes. Rain is measured in millimeters."
  - id: boost-3
    type: choice
    prompt: "What does print('hello') show?"
    options:
      - {id: a, text: "hello", correct: true}
      - {id: b, text: "print"}
      - {id: c, text: "Nothing"}
    feedback_right: "Yes. print shows the text."
  - id: boost-4
    type: choice
    prompt: "Which of these is a list in Python?"
    options:
      - {id: a, text: "[1, 2, 3]", correct: true}
      - {id: b, text: "'1, 2, 3'"}
      - {id: c, text: "123"}
    feedback_right: "Yes. Square brackets make a list."
