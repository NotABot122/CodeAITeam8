# Zone: Function Workshop (functions). Grades 9-12. Code is Python, as in the lesson.
# Layout rule (enforced by check-content): code goes in `code:` as a block, never inside the prompt
# sentence. Short names and values inside sentences use `backticks`.
concept: functions
explain:
  id: helper-explain
  nodes: [inputs_outputs]
  prompt: "Explain to Nimbus: what is a function, and why is it useful?"
  key_ideas:
    - {id: reuse, level: 1, label: "a named set of steps to use again", words: ["helper", "name", "reuse", "use again", "same steps", "again", "over and over", "def", "call it", "named"]}
    - {id: in_out, level: 2, label: "takes something in and gives something back", words: ["give back", "gives back", "get back", "returns", "return", "input", "output", "goes in", "comes out", "you give it", "parameter", "argument"]}
    - {id: teams, level: 3, label: "functions work together", words: ["team", "together", "one after", "pass", "hand it", "combine", "each helper", "in order", "next helper", "calls another", "result of one", "into the next"]}
items:
  - id: fun-1a
    tier: 1
    type: choice
    nodes: [named_steps]
    prompt: "The same three lines appear in five places in your program. What is the best fix?"
    options:
      - {id: a, text: "Put them in a function with a clear name and call it", correct: true}
      - {id: b, text: "Keep copying and pasting the lines", misconception: copies_instead_of_reuse, why: "A function lets you write the lines once and fix bugs in one place."}
      - {id: c, text: "Keep one copy and delete the other four", misconception: does_it_once, why: "The program still needs those steps in five places."}
      - {id: d, text: "Rename the variables", misconception: ignores_task, why: "Renaming does not remove the repetition."}
    feedback_right: "Yes. Write it once, call it many times."
  - id: fun-1b
    tier: 1
    type: order
    nodes: [named_steps]
    misconception: steps_out_of_order
    prompt: "Put the lines of the function `hot_label` in order."
    cards:
      - {id: s1, text: "def hot_label(temp):"}
      - {id: s2, text: "    is_hot = temp >= 35.0"}
      - {id: s3, text: "    label = 'HOT' if is_hot else 'NOT HOT'"}
      - {id: s4, text: "    return label"}
    feedback_right: "Yes. Each line uses the one before it."
    feedback_wrong: "A line can only use a variable that an earlier line created."
  - id: fun-2a
    tier: 2
    type: sort
    display: chips
    nodes: [inputs_outputs]
    misconception: mixes_input_output
    prompt: "Sort each item into Goes in (parameter) or Comes out (return value)."
    code: |
      def add_rain(a, b):
          return a + b
    buckets:
      - {id: in, text: "Goes in"}
      - {id: out, text: "Comes out"}
    cards:
      - {id: c1, text: "`a`", bucket: in}
      - {id: c2, text: "`b`", bucket: in}
      - {id: c3, text: "`a + b`", bucket: out}
      - {id: c4, text: "the value of `add_rain(2, 3)`", bucket: out}
    feedback_right: "Yes. Parameters go in, the return value comes out."
    feedback_wrong: "Parameters are listed after `def`. The return value is what the call gives back."
  - id: fun-2b
    tier: 2
    type: trace
    nodes: [inputs_outputs]
    prompt: "What does `twice(6)` return?"
    code: |
      def twice(x):
          return x + x
    options:
      - {id: a, text: "12", correct: true}
      - {id: b, text: "6", misconception: returns_input, why: "The function returns `x + x`, not `x`."}
      - {id: c, text: "36", misconception: multiplies_instead, why: "`x + x` is `6 + 6`, not `6 * 6`."}
      - {id: d, text: "66", misconception: joins_digits, why: "6 is a number, so `+` adds. It would join only if `x` were the text `'6'`."}
    feedback_right: "Yes. 6 + 6 is 12."
  - id: fun-3a
    tier: 3
    type: order
    nodes: [combine_helpers]
    misconception: wrong_call_order
    prompt: "`build_report` uses three functions you wrote. Put its lines in order."
    cards:
      - {id: s1, text: "rows = get_readings(conn, station, start, end)"}
      - {id: s2, text: "pairs = [(r, classify_day(r)) for r in rows]"}
      - {id: s3, text: "report = summarize(pairs)"}
      - {id: s4, text: "return report"}
    feedback_right: "Yes. Each function's result feeds the next."
    feedback_wrong: "Each line needs the value the line before it made."
  - id: fun-3b
    tier: 3
    type: choice
    nodes: [combine_helpers]
    prompt: "`summarize` needs a list of `(row, labels)` pairs. Which call should `build_report` make?"
    options:
      - {id: a, text: "`summarize([(r, classify_day(r)) for r in rows])`", correct: true}
      - {id: b, text: "`summarize(rows)`", misconception: skips_a_helper, why: "`summarize` needs the labels from `classify_day` too."}
      - {id: c, text: "`classify_day(summarize(rows))`", misconception: wrong_call_order, why: "`summarize` needs the labels, so `classify_day` runs first."}
      - {id: d, text: "Copy the code of `summarize` into `build_report`", misconception: copies_instead_of_reuse, why: "Functions can call each other. No copying needed."}
    feedback_right: "Yes. Pass each result along."
