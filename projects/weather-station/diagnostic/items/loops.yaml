# Zone: Loop Lab (loops). Grades 9-12. Code is Python, as in the lesson.
# Layout rule (enforced by check-content): code goes in `code:` as a block, never inside the prompt
# sentence. Short names and values inside sentences use `backticks`.
# rep-3b is a poly-hierarchy item: it feeds count_with_rule (loops) and also
# gives credit to if_else_compare (conditionals) when answered right.
concept: loops
explain:
  id: repeat-explain
  nodes: [running_total]
  prompt: "Explain to Nimbus: how would your code add up the rain from many days?"
  key_ideas:
    - {id: repeats, level: 1, label: "does the same step again", words: ["again", "repeat", "over and over", "each day", "every day", "each one", "loop", "one by one", "for each", "for loop", "iterate", "go through"]}
    - {id: keeps_total, level: 2, label: "keeps a total as it goes", words: ["total", "add", "count", "keep track", "running", "so far", "adds up", "adding", "+=", "accumulat", "sum variable"]}
    - {id: handles_rules, level: 3, label: "remembers the biggest or counts only some", words: ["biggest", "highest", "most", "remember", "only if", "only the", "start at", "start with zero", "empty", "none", "max so far", "if inside the loop"]}
items:
  - id: rep-1a
    tier: 1
    type: choice
    option_format: code
    nodes: [repeat_steps]
    prompt: "Which line prints every value in `rains`?"
    code: |
      rains = [2.0, 5.5, 1.0]
    options:
      - {id: a, text: "for r in rains: print(r)", correct: true}
      - {id: b, text: "if rains: print(rains[0])", misconception: confuses_if_with_repeat, why: "An if runs once. A loop runs once per item."}
      - {id: c, text: "print(rains[0])", misconception: does_it_once, why: "That prints only the first value."}
      - {id: d, text: "rains = []", misconception: ignores_task, why: "That empties the list instead of printing it."}
    feedback_right: "Yes. The for loop visits each item."
  - id: rep-1b
    tier: 1
    type: trace
    nodes: [repeat_steps]
    prompt: "What is `count` after this loop?"
    code: |
      count = 0
      for day in range(3):
          count += 1
    options:
      - {id: a, text: "3", correct: true}
      - {id: b, text: "1", misconception: loop_runs_once, why: "`range(3)` runs the body three times."}
      - {id: c, text: "0", misconception: ignores_task, why: "`count` goes up on every pass."}
      - {id: d, text: "4", misconception: off_by_one, why: "`range(3)` gives 0, 1, 2: three passes."}
    feedback_right: "Yes. Three passes, so 3."
  - id: rep-2a
    tier: 2
    type: trace
    nodes: [running_total]
    prompt: "What is `total` after this loop?"
    code: |
      total = 0
      for r in [2, 5, 1]:
          total += r
    options:
      - {id: a, text: "8", correct: true}
      - {id: b, text: "1", misconception: keeps_last_only, why: "`+=` adds to `total`. It does not replace it."}
      - {id: c, text: "5", misconception: keeps_biggest, why: "A running total adds every value."}
      - {id: d, text: "2", misconception: keeps_first_only, why: "The loop keeps adding after the first value."}
    feedback_right: "Yes. 2 + 5 + 1 is 8."
  - id: rep-2b
    tier: 2
    type: order
    nodes: [running_total]
    misconception: skips_start_value
    prompt: "Put these lines in order so the function adds up `rain_mm` over all rows."
    cards:
      - {id: s1, text: "total = 0.0"}
      - {id: s2, text: "for row in rows:"}
      - {id: s3, text: "    total += row['rain_mm']"}
      - {id: s4, text: "return total"}
    feedback_right: "Yes. Start the total before the loop and return it after."
    feedback_wrong: "The total has to exist before the loop adds to it."
  - id: rep-3a
    tier: 3
    type: trace
    nodes: [find_biggest]
    prompt: "What is `highest` after this loop?"
    code: |
      highest = None
      for t in [12, 30, 25]:
          if highest is None or t > highest:
              highest = t
    options:
      - {id: a, text: "30", correct: true}
      - {id: b, text: "25", misconception: keeps_last_only, why: "`highest` only changes when `t` is bigger. 25 is not bigger than 30."}
      - {id: c, text: "12", misconception: keeps_first_only, why: "The loop keeps checking after the first value."}
      - {id: d, text: "67", misconception: adds_instead, why: "This tracks the largest value. It does not add."}
    feedback_right: "Yes. 30 is the largest."
  - id: rep-3b
    tier: 3
    type: trace
    nodes: [count_with_rule, if_else_compare]
    prompt: "What is `count` after this loop?"
    code: |
      count = 0
      for t in [36, 30, 35, 41]:
          if t >= 35:
              count += 1
    options:
      - {id: a, text: "3", correct: true}
      - {id: b, text: "2", misconception: at_least_means_over, why: "`>= 35` includes 35, so it counts."}
      - {id: c, text: "4", misconception: counts_every_day, why: "`count` only goes up when the if is True."}
      - {id: d, text: "1", misconception: counts_first_only, why: "The loop checks every value, not only the first."}
    feedback_right: "Yes. 36, 35 and 41 count."
