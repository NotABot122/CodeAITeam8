# Configuration for the Weather Station readiness check (grades 9-12, same audience as the lesson).
# Everything a curriculum author may want to tune lives here, not in code.
id: weather-station-readiness
title: Weather Station Readiness Check
grade_band: "9-12"
version: 1

# The tier ladder: a pass at tier N is evidence for Stage N.
limits:
  max_scored_items: 16          # hard cap on scored questions for the whole quest
  max_items_per_zone: 4         # cap for one concept's ladder
  max_bonus_items: 3            # confirmation questions after all zones
  bonus_min_stage: 2            # only confirm stage claims at or above this
  bonus_confidence_target: 0.8  # confirm a claim whose confidence is below this
  max_explain_prompts: 2        # typed "explain" answers per quest: typing is the slowest part
  explain_below_confidence: 0.85  # only ask when the answers alone leave a concept this unsure
  max_boosters: 2               # unscored "breather" questions
  misses_before_booster: 3      # consecutive misses that trigger a breather
  # ASSUMPTIONS for the time estimate only. Measure real grade 9-12 timing in a pilot and update these.
  seconds_per_item: 40
  seconds_per_explain: 70
  target_minutes: 15

# Fraction of an answer that must be right to count as a pass.
pass_credit:
  choice: 1.0
  spot: 1.0
  trace: 1.0
  order: 1.0
  sort: 0.8

# Skill tree thresholds (ratio of points earned to points possible).
thresholds:
  unlock: 0.5
  master: 0.75

# How a stage is estimated from the answers (guess-and-slip model, see diagnostic/scoring.py).
scoring:
  slip: 0.08                       # chance a student who knows the idea still misses a question
  prior: [0.25, 0.30, 0.25, 0.20]  # chance of true stage 0, 1, 2, 3 before any answers
  borderline_below: 0.7            # confidence under this marks a concept "borderline"

# Reading level for everything students read (high school). Enforced by check-content.
readability:
  max_sentence_words: 30
  max_word_length: 16

# Free-text answers ("explain"). Short answers are fine, so the too-short bar
# is lower than the harness default of 8 words.
text:
  min_words: 3
  max_chars: 400
  max_goal_chars: 80

zones:
  - id: zone-log
    concept: database_retrieval
    name: Data Lookup
    story: "The station stores one row per day in a table. Pull out the rows you need."
    done_message: "Data Lookup done."
  - id: zone-decide
    concept: conditionals
    name: Decision Point
    story: "Read some if statements and predict what they do."
    done_message: "Decision Point done."
  - id: zone-repeat
    concept: loops
    name: Loop Lab
    story: "Trace loops that count, total and track the largest value."
    done_message: "Loop Lab done."
  - id: zone-helpers
    concept: functions
    name: Function Workshop
    story: "See how functions take inputs, return values and work together."
    done_message: "Function Workshop done."

# What the student wants to make. Emphasis says which concepts the goal leans on.
goals:
  - {id: weather_report, label: "Build a weather report from real data", emphasis: {database_retrieval: 1.0, conditionals: 0.8, loops: 0.8, functions: 0.6}}
  - {id: build_game,     label: "Make a game",                emphasis: {database_retrieval: 0.2, conditionals: 1.0, loops: 1.0, functions: 0.7}}
  - {id: find_facts,     label: "Find patterns in data",     emphasis: {database_retrieval: 1.0, conditionals: 0.5, loops: 0.9, functions: 0.4}}
  - {id: make_helpers,   label: "Build tools people can use", emphasis: {database_retrieval: 0.4, conditionals: 0.6, loops: 0.6, functions: 1.0}}
  - {id: not_sure,       label: "I'm not sure yet",            emphasis: {database_retrieval: 0.6, conditionals: 0.6, loops: 0.6, functions: 0.6}}

# Choose-an-avatar list. Picked from this list, never typed, so no names are collected.
buddies:
  - {id: cloud,   label: "Cumulus"}
  - {id: bolt,    label: "Bolt"}
  - {id: drop,    label: "Drizzle"}
  - {id: sun,     label: "Solar"}

game:
  guide:
    name: Nimbus
    welcome: "I'm {guide}. This short check finds where you should start the Weather Station project. It is not a test and nothing here is graded."
    right:
      - "Correct."
      - "Right."
      - "Nice reasoning."
      - "Yes, keep going."
    wrong:
      - "Not quite. Here is why."
      - "Close. Here is the key idea."
      - "Not this time. Here is what to remember."
    streak: "Three in a row."
    booster_intro: "Quick break question."
    explain_intro: "Explain it in your own words. One or two sentences is fine."
    explain_skip: "No problem. Moving on."
    bonus_intro: "One more question to confirm."
    flagged_text: "That answer was skipped. Please keep answers respectful and on topic."
    goal_flagged: "A default goal was picked. You can change it later."
    finish: "Check complete, {buddy}."
  xp:
    try: 5               # for every answer, so effort is rewarded
    correct: 5           # added when the answer was right
    streak_bonus: 2      # per answer after the third correct in a row
    explain: 8           # for telling the guide in words
    booster: 3
  ranks:                 # XP needed -> title (shown to the student, never a mastery claim)
    - {xp: 0,   title: Cloud Cadet}
    - {xp: 40,  title: Rain Ranger}
    - {xp: 90,  title: Storm Chaser}
    - {xp: 150, title: Thunder Captain}
  badges:
    - {id: first_step,   name: First Step,       when: "answer one question"}
    - {id: hot_streak,   name: Hot Streak,       when: "3 right answers in a row"}
    - {id: bounce_back,  name: Bounce Back,      when: "a right answer right after a miss"}
    - {id: storyteller,  name: Storyteller,      when: "explain an idea in words"}
    - {id: zone_clear,   name: Zone Explorer,    when: "finish a zone"}
    - {id: quest_done,   name: Quest Complete,   when: "finish the whole quest"}

# Words kept out of anything a student reads. Stages and scores stay with teachers.
student_text_ban:
  - stage
  - score
  - scored
  - grade
  - failed
  - mastery
  - percent
  - level 0
  - level 1
  - level 2
  - level 3
