- id: q1
  type: predict
  prompt: What does this code print?
  code: |
    import sqlite3
    conn = sqlite3.connect(":memory:")
    conn.execute("CREATE TABLE t (day TEXT, rain REAL)")
    conn.executemany("INSERT INTO t VALUES (?, ?)", [("mon", 0.0), ("tue", 12.5), ("wed", 30.0)])
    rows = conn.execute("SELECT day FROM t WHERE rain >= ?", (12.5,)).fetchall()
    print(len(rows))
  choices: ["1", "2", "3"]
  answer: 1
  explanation: ">= keeps rows equal to 12.5 too, so tue (12.5) and wed (30.0) match. That's 2 rows."
- id: q2
  type: predict
  prompt: This code builds SQL by adding text together. How many quote marks (') end up in the SQL?
  code: |
    name = "O'Brien"
    sql = "SELECT * FROM players WHERE name = '" + name + "'"
    print(sql.count("'"))
  choices: ["2", "3", "4"]
  answer: 1
  explanation: "The two quotes around the name plus the one inside O'Brien make 3. The extra quote ends the text early and breaks the query. With a ? placeholder, the value never becomes part of the SQL text."
- id: q3
  type: explain
  prompt: In your own words, why should you pass values with ? placeholders instead of adding them into the SQL text yourself?
  rubric:
    0: No reason given, or the answer is off topic.
    1: Says placeholders are safer or are the rule, without saying why.
    2: Explains that a value with a quote can break the query, or that someone could change what the query does (SQL injection).
    3: Explains both problems and that the database treats placeholder values only as data, never as part of the SQL command.
