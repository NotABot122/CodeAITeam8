# Function bank for Level 1: Build a List. Only what the answer should use.
- call: my_list.append(item)
  summary: |-
    Adds one item to the end of a list. It changes the list itself and gives back nothing.
  example: |-
    names = []
    names.append("Ada")
    # names is now ["Ada"]
- call: my_list.sort()
  summary: |-
    Puts a list in order, smallest first. Dates written as YYYY-MM-DD sort oldest first.
    It changes the list itself and gives back nothing.
  example: |-
    days = ["2026-03-04", "2026-01-30"]
    days.sort()
    # days is now ["2026-01-30", "2026-03-04"]
