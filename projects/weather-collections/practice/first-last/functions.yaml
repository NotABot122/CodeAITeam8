# Function bank for Practice: First and Last Day.
- call: my_list.append(item)
  summary: |-
    Adds one item to the end of a list. It changes the list itself and gives back nothing.
  example: |-
    words = []
    words.append("hi")
- call: my_list.sort()
  summary: |-
    Puts a list in order, smallest first, so the earliest date ends up at [0] and the latest at [-1].
  example: |-
    nums = [5, 1, 3]
    nums.sort()
    nums[0], nums[-1]
    # (1, 5)
