AWSTemplateFormatVersion: '2010-09-09'
Description: Private versioned curriculum and a future student-progress table for CodeAI.
Resources:
  CurriculumBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  CurriculumBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CurriculumBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CurriculumBucket.Arn
              - !Sub '${CurriculumBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
  StudentProgress:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
Outputs:
  CurriculumBucketName:
    Value: !Ref CurriculumBucket
  CurriculumBucketArn:
    Value: !GetAtt CurriculumBucket.Arn
  StudentProgressTableName:
    Value: !Ref StudentProgress
  StudentProgressTableArn:
    Value: !GetAtt StudentProgress.Arn
